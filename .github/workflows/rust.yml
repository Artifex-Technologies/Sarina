# The Rust port of the Go core (rust/, docs/RUST_PORT.md): the Go fixtures current, format, lints, the tests (every
# fixture compared with the Rust code, the properties, the fuzz targets' bodies), and both builds' CLI and service side
# by side, and sarina-tone's.
name: rust
on:
  push:
    paths: ["rust/**", "go/**", "testdata/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "go/**", "testdata/**", ".github/workflows/rust.yml"]
  schedule:
    - cron: "29 5 * * 1" # the audit weekly, for advisories published after the last change
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0, pinned by commit
        with:
          go-version: "1.27"
      - name: the Go fixtures are current
        working-directory: go
        run: go test ./... -run Parity
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - working-directory: rust
        run: cargo fmt --all --check
      - working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: rust
        run: cargo test --locked
      # both builds on the same command lines (rust/parity/cli-differential.py), the Go build only as the reference; each
      # case in a user and network namespace of its own, which Ubuntu's AppArmor keeps from unprivileged users by default
      - name: the CLI differential
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          (cd go && go build -o "$RUNNER_TEMP/sarina-go" ./cmd/sarina)
          (cd rust && cargo build --locked --bin sarina-rs)
          python3 -I rust/parity/cli-differential.py --go "$RUNNER_TEMP/sarina-go" --rs rust/target/debug/sarina-rs
      # both builds' services on the same scripted requests (rust/parity/service-differential.py)
      - name: the service differential
        run: python3 -I rust/parity/service-differential.py --go "$RUNNER_TEMP/sarina-go" --rs rust/target/debug/sarina-rs
      # both builds' consoles on the same scripted page requests, runs and approvals (rust/parity/gui-differential.py)
      - name: the GUI differential
        run: python3 -I rust/parity/gui-differential.py --go "$RUNNER_TEMP/sarina-go" --rs rust/target/debug/sarina-rs
      # the Go sarina-tone (the reference until the Go code goes) and the Rust one on the same command lines, files and
      # made-up recordings (rust/parity/tone-differential.py)
      - name: the sarina-tone differential
        run: |
          (cd go && go build -o "$RUNNER_TEMP/sarina-tone-go" ./cmd/sarina-tone)
          (cd rust && cargo build --locked --bin sarina-tone)
          python3 -I rust/parity/tone-differential.py --go "$RUNNER_TEMP/sarina-tone-go" --rs rust/target/debug/sarina-tone
  # every Rust lock file of the repository against RustSec's advisories
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-audit
      # RUSTSEC-2024-0436: paste is unmaintained (no vulnerability); it comes with tokenizers in the ML helpers and the
      # voice service. Revisit when tokenizers drops it.
      - run: |
          for lock in rust/Cargo.lock packaging/helpers/Cargo.lock packaging/voice/Cargo.lock packaging/voiced/Cargo.lock; do
            cargo audit --file "$lock" --deny warnings --ignore RUSTSEC-2024-0436
          done
