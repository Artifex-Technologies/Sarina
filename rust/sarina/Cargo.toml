[package]
name = "sarina"
version = "0.1.0"
description = "Sarina's Go core, ported to Rust piece by piece (docs/RUST_PORT.md)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sarina"
path = "src/lib.rs"

# Exact versions on purpose (the lock file pins the rest).
[dependencies]
# Go's regexp: \b \w \d \s are written out as Go's ASCII classes where a pattern uses them, so Unicode's Perl classes stay out
regex = { version = "=1.12.3", default-features = false, features = ["std", "perf", "unicode-case"] }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# float_roundtrip: numbers read as Go reads them (correctly rounded), so fixtures compare exactly
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
