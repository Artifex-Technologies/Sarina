[package]
name = "sarina"
version = "0.1.0"
description = "Sarina's Go core, ported to Rust piece by piece (docs/RUST_PORT.md)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sarina"
path = "src/lib.rs"

# Exact versions on purpose (the lock file pins the rest).
[dependencies]
# Go's regexp: \b \w \d \s are written out as Go's ASCII classes where a pattern uses them, so Unicode's Perl classes stay out
regex = { version = "=1.12.3", default-features = false, features = ["std", "perf", "unicode-case"] }
# ed25519 for Heimdall's signed list of approved files (trust.rs); the same crate and version as Heimdall's mesh
ring = { version = "=0.17.14", default-features = false }
# sha256 of the approved files (trust.rs) and the caches' content hashes; as Heimdall and Limbo
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
# TLS for the model clients (gohttp): ring's crypto, TLS 1.3 and 1.2 as Go's client offers; the same crate and version as
# Heimdall's
# kill(2) on an MCP server's process group (Go's syscall.Kill(-pid, SIGKILL)); the same version as Heimdall's
libc = { version = "=0.2.186", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# float_roundtrip: numbers read as Go reads them (correctly rounded), so fixtures compare exactly
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
