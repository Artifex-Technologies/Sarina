[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarina-helpers"
version = "0.1.0"
description = "Optional Python helpers (local embeddings, voice) called by the Go sarina binary"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["onnxruntime", "tokenizers"]
voice = ["faster-whisper", "piper-tts"]
test = ["pytest"]

[tool.setuptools]
packages = ["sarina_helpers"]

[tool.setuptools.package-dir]
sarina_helpers = "sarina_helpers"

[tool.pytest.ini_options]
testpaths = ["tests"]
