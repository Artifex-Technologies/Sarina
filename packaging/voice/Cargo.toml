[package]
name = "sarina-voice"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Sarina's spoken-question programs (the conversation, the daily check-up, the voice client) in one binary"
publish = false

[lib]
name = "sarina_voice"
path = "src/lib.rs"

[[bin]]
name = "sarina-voice"
path = "src/main.rs"

# The side-by-side tests (tests/) call single functions through this; it is never installed.
[[bin]]
name = "sarina-voice-testhook"
path = "src/bin/testhook.rs"
required-features = ["testhook"]

[features]
testhook = []

[dependencies]
regex = "1.12"
libc = "0.2.186"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
