[package]
name = "sarina-helpers"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Sarina's ML and voice helper (embeddings, memory search, desktop-audit's classifier, voice chat), the port of python/sarina_helpers"
publish = false

[lib]
name = "sarina_helpers"
path = "src/lib.rs"

[[bin]]
name = "sarina-helpers"
path = "src/main.rs"

[dependencies]
# Python's str.isspace, repr(float) and repr(str), shared with the voice programs (packaging/voice)
sarina-voice = { path = "../voice" }
# ONNX Runtime, loaded at run time from the system's onnxruntime (or ORT_DYLIB_PATH): nothing is downloaded or linked at
# build time, as in packaging/voiced. The processor only, as the Python helper asked for (CPUExecutionProvider).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
# the library Python's tokenizers package binds (the same version as packaging/voiced), with the same regular-expression engine
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# the prototype set's fingerprint
sha2 = "0.10"
# piper's phonemes are decomposed (NFD) as Python's unicodedata does
unicode-normalization = "0.1"
libc = "0.2"

# The side-by-side checks (tests/differential.py) call single functions through this; it is never installed.
[[bin]]
name = "sarina-helpers-parity"
path = "src/bin/parity.rs"
required-features = ["parity"]

[features]
parity = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
